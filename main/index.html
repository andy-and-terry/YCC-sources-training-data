<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Welcome!</title>
		<script async src="assets/keyInMessage.js"></script>
		<link rel="stylesheet" href="assets/container.css">
		<link rel="stylesheet" href="assets/html.css">
		<link rel="stylesheet" href="assets/body.css">
		<link rel="stylesheet" href="assets/bluebutton.css">
    </head>
    <body>
        <div class="container">
            <div class="item item1">
				<img src="assets/yc-rectangle.svg">
			</div>
            <div class="item item2">
				<span id="chat-name">New Chat</span>
			</div>
			<div class="item item3">
				<span id="chat-list"><small>Loading chats...</small></span>
			</div>
            <div class="item item4">4</div>
            <div class="item item5">5</div>
            <div class="item item6">
				<textarea name="chatText" placeholder="Your message here..." rows="1" spellcheck required></textarea>
			</div>
			<div class="item item7">
				<p><span class="acc-name-font" id="acc-name"><small>Loading account...</small></span></p>
				<p><small><i><span id="view-acc-detail"><button class="bluebutton" onclick="accountDetail()">View account details</button></span></i></small></p>
			</div>
        </div>
   </body>
</html>
