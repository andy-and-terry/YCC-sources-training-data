<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YCC Chat</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #4f8cff;
    --user-bubble: #4f8cff;
    --ai-bubble: #21262d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--dim); }
  header .spacer { flex: 1; }
  #whoami { font-size: 12px; color: var(--dim); }
  #logoutBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--ai-bubble); border-bottom-left-radius: 4px; }
  .ai.pending { color: var(--dim); font-style: italic; }
  form {
    display: flex;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    gap: 10px;
  }
  input[type=text], input[type=password] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Login screen: covers the whole page until the user logs in. */
  #loginScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #loginBox {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #loginBox h2 { margin: 0 0 8px; font-size: 16px; }
  #loginError { color: #ff7b72; font-size: 13px; min-height: 16px; }
  #app { display: none; } /* hidden until login succeeds */
</style>
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<!-- Shown first. The chat UI (#app) stays hidden until /login succeeds. -->
<div id="loginScreen">
  <form id="loginBox">
    <h2>YCC Chat login</h2>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username" />
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Log in</button>
    <div id="loginError"></div>
  </form>
</div>

<!-- ===================== CHAT APP (hidden until logged in) ===================== -->
<div id="app">
  <header>
    <h1>YCC Chat</h1>
    <select id="modelSelect"><option>Loading models…</option></select>
    <div class="spacer"></div>
    <span id="whoami"></span>
    <button id="logoutBtn" type="button">Log out</button>
  </header>

  <div id="messages"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Say something…" autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
// ---------------------------------------------------------------------------
// Grab references to all the DOM elements we'll need. Doing this once up
// front (instead of querying repeatedly) keeps the code below readable.
// ---------------------------------------------------------------------------
const loginScreen = document.getElementById('loginScreen');
const loginBox    = document.getElementById('loginBox');
const loginUser   = document.getElementById('loginUser');
const loginPass   = document.getElementById('loginPass');
const loginError  = document.getElementById('loginError');

const appEl       = document.getElementById('app');
const whoamiEl    = document.getElementById('whoami');
const logoutBtn   = document.getElementById('logoutBtn');

const messagesEl  = document.getElementById('messages');
const form        = document.getElementById('form');
const input       = document.getElementById('input');
const sendBtn     = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');

// The logged-in username. The server calls this "userid" and expects it on
// every /chat request, so it knows who is talking. We keep it in
// localStorage so a page refresh doesn't force you to log in again.
let userid = localStorage.getItem('ycc_userid') || null;

// ---------------------------------------------------------------------------
// Ask the server for the list of models and fill the <select> dropdown.
// Runs once, right after login.
// ---------------------------------------------------------------------------
async function loadModels() {
  try {
    const res = await fetch('/models');
    const data = await res.json();
    modelSelect.innerHTML = '';
    // Remote (val.town) models first, then local .pt models.
    [...data.remote, ...data.local].forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      modelSelect.appendChild(opt);
    });
  } catch (e) {
    modelSelect.innerHTML = '<option>Failed to load models</option>';
  }
}

// ---------------------------------------------------------------------------
// Add one chat bubble to the message list and scroll to the bottom.
// role is either 'user' or 'ai' — it picks which CSS class (and therefore
// which side/color) the bubble gets.
// ---------------------------------------------------------------------------
function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div; // returned so the caller can update it later (see 'pending' below)
}

// ---------------------------------------------------------------------------
// Switch from the login screen to the chat app, and load the model list.
// ---------------------------------------------------------------------------
function showApp() {
  loginScreen.style.display = 'none';
  appEl.style.display = 'flex';
  appEl.style.flexDirection = 'column';
  appEl.style.height = '100%';
  whoamiEl.textContent = userid;
  loadModels();
  input.focus();
}

// If we already have a saved userid from a previous visit, skip the login
// screen entirely.
if (userid) {
  showApp();
}

// ---------------------------------------------------------------------------
// LOGIN: send username/password to the server. If correct, the server
// gives back the userid, which we save and then show the chat app.
// ---------------------------------------------------------------------------
loginBox.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.textContent = '';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: loginUser.value, password: loginPass.value })
    });
    if (!res.ok) {
      loginError.textContent = 'Wrong username or password.';
      return;
    }
    const data = await res.json();
    userid = data.userid;
    localStorage.setItem('ycc_userid', userid);
    showApp();
  } catch (err) {
    loginError.textContent = 'Could not reach server.';
  }
});

// ---------------------------------------------------------------------------
// LOGOUT: forget the saved userid and go back to the login screen.
// ---------------------------------------------------------------------------
logoutBtn.addEventListener('click', () => {
  userid = null;
  localStorage.removeItem('ycc_userid');
  messagesEl.innerHTML = '';
  loginPass.value = '';
  appEl.style.display = 'none';
  loginScreen.style.display = 'flex';
});

// ---------------------------------------------------------------------------
// SEND A CHAT MESSAGE.
// 1. Show the user's own message immediately.
// 2. Show a "Thinking…" placeholder bubble for the AI's reply.
// 3. POST to /chat with { model, prompt, userid }.
// 4. Replace the placeholder text with the real reply (or an error).
// ---------------------------------------------------------------------------
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;

  addMessage(prompt, 'user');
  input.value = '';
  sendBtn.disabled = true; // prevent double-sends while waiting

  const pending = addMessage('Thinking…', 'ai');
  pending.classList.add('pending');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelSelect.value, prompt, userid })
    });
    const data = await res.json();
    pending.textContent = data.response || data.error || 'No response';
  } catch (err) {
    pending.textContent = 'Error: could not reach server.';
  } finally {
    pending.classList.remove('pending');
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
